
{% extends "base.html" %}

{% block title %}Create a Team | SkillBridge{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="mb-2">Create a Team</h2>
                    <p class="text-muted mb-4">
                        Build a team and collaborate with other students.
                    </p>

                    <form method="POST"
                          action="{{ url_for('auth.create_team') }}">

                        <input type="hidden"
                               name="csrf_token"
                               value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Team Name</label>
                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                maxlength="120"
                                required
                                placeholder="e.g. Python Project Team"
                            >
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">
                                Team Description
                            </label>
                            <textarea
                                class="form-control"
                                id="description"
                                name="description"
                                rows="3"
                                maxlength="2000"
                                placeholder="Describe your team's goals"
                            ></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="project_id" class="form-label">
                                Project
                            </label>
                            <select
                                class="form-select"
                                id="project_id"
                                name="project_id"
                            >
                                <option value="">Choose a project (optional)</option>
                                {% for project in projects %}
                                    <option value="{{ project.id }}">
                                        {{ project.title }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="max_members" class="form-label">
                                Maximum Team Members
                            </label>
                            <select
                                class="form-select"
                                id="max_members"
                                name="max_members"
                                required
                            >
                                {% for size in range(2, 9) %}
                                    <option
                                        value="{{ size }}"
                                        {% if size == 4 %}selected{% endif %}
                                    >
                                        {{ size }} members
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Create Team
                        </button>

                        <a href="{{ url_for('auth.teams') }}"
                           class="btn btn-outline-secondary ms-2">
                            Cancel
                        </a>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
